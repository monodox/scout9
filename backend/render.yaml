services:
  - type: web
    name: scout9-backend
    runtime: python
    buildCommand: |
      # Install system dependencies for WeasyPrint
      apt-get update && apt-get install -y \
        libpango-1.0-0 \
        libpangoft2-1.0-0 \
        libharfbuzz0b \
        libfontconfig1 \
        libcairo2 \
        libgdk-pixbuf2.0-0 \
        shared-mime-info \
      && pip install --upgrade pip \
      && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
